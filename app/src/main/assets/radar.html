<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #ddd; }
        #map { position: absolute; top: 0; left: 0; bottom: 0; right: 0; }
    </style>
    <link rel="stylesheet" href="leaflet.css"/>
    <script src="leaflet.js"></script>
</head>
<body>
<div id="map"></div>
<script>
(function () {
    var qs = decodeURIComponent(location.search.substring(1));
    var params = {};
    qs.split('&').forEach(function (p) {
        var kv = p.split('=');
        if (kv.length === 2) params[kv[0]] = kv[1];
    });
    var lat = parseFloat(params['lat'] || '39');
    var lon = parseFloat(params['lon'] || '-98');

    var map = L.map('map', { zoomControl: false, attributionControl: false })
               .setView([lat, lon], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        subdomains: ['a', 'b', 'c']
    }).addTo(map);

    var radarLayer = null;

    window.setRadarTiles = function (tileUrl) {
        if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
        if (tileUrl) {
            radarLayer = L.tileLayer(tileUrl, { opacity: 0.55, maxZoom: 19 }).addTo(map);
        }
    };
}());
</script>
</body>
</html>
